<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006600"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Simulateur GONI Plus Terrain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : outil à une colonne pour téléphone ; saisie en haut, verdict et chiffres en dessous, onglets fixes en bas. */
:root{
  --bg:#EEF1EC; --surface:#FCFDFB; --ink:#15211A; --muted:#56645A; --line:#CDD6CC;
  --accent:#006600; --accent-ink:#FFFFFF; --accent-soft:#DCECDB;
  --ok:#1C6B45; --ok-soft:#DAEBE1; --warn:#96610A; --warn-soft:#F5E8CB; --bad:#A63124; --bad-soft:#F4DBD7;
  --c1:#006600; --c2:#7DB37D; --c3:#C48A16; --c4:#A63124; --c5:#2F7D6B; --c6:#8A909A; --brand2:#C2590C;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101710; --surface:#1A231B; --ink:#E5EAF1; --muted:#9AA6B6; --line:#334034;
  --accent:#72C872; --accent-ink:#0C180C; --accent-soft:#1F3520;
  --ok:#62BE8C; --ok-soft:#1D3528; --warn:#E2B255; --warn-soft:#3A2F17; --bad:#EE8D7F; --bad-soft:#41221E;
  --c1:#72C872; --c2:#4E8F4E; --c3:#E2B255; --c4:#EE8D7F; --c5:#5FC2AC; --c6:#8A94A3; --brand2:#F29A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101710; --surface:#1A231B; --ink:#E5EAF1; --muted:#9AA6B6; --line:#334034;
  --accent:#72C872; --accent-ink:#0C180C; --accent-soft:#1F3520;
  --ok:#62BE8C; --ok-soft:#1D3528; --warn:#E2B255; --warn-soft:#3A2F17; --bad:#EE8D7F; --bad-soft:#41221E;
  --c1:#72C872; --c2:#4E8F4E; --c3:#E2B255; --c4:#EE8D7F; --c5:#5FC2AC; --c6:#8A94A3; --brand2:#F29A4A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 96px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--brand2)}
.logo{width:46px;height:46px;border-radius:8px;background:#fff;border:1px solid var(--line);flex:none}
.offre{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.offre.sel{border:2px solid var(--accent)}
.offre .px{font-family:var(--display);font-weight:700;color:var(--brand2)}
.msg{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13.5px;user-select:all}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:23px} h2{font-size:18px} h3{font-size:15px} p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.row>label{flex:1 1 140px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-height:38px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.verdict{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;border:2px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.warn{background:var(--warn-soft);border-color:var(--warn)} .verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict b{font-family:var(--display);font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-top:3px solid var(--accent);padding-top:6px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted)} .src a{color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.cash{display:grid;grid-template-columns:52px 1fr 92px;gap:8px;align-items:center;font-size:12.5px}
.cash .tr{position:relative;height:14px;background:var(--bg);border-radius:3px}
.cash .tr i{position:absolute;top:0;height:14px;border-radius:2px}
.cash .tr u{position:absolute;top:-2px;width:1px;height:18px;background:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.neg{color:var(--bad);font-weight:600} .pos{color:var(--ok);font-weight:600}
td.g-neg{background:var(--bad-soft);color:var(--bad);font-weight:600} td.g-pos{background:var(--ok-soft);color:var(--ok);font-weight:600} td.g-mid{background:var(--warn-soft);color:var(--warn);font-weight:600}
td.g-ref{outline:2px solid var(--ink);outline-offset:-2px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.cmp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.cmp:first-of-type{border-top:0}
.cmp .tr{position:relative;height:16px;background:var(--bg);border-radius:3px}
.cmp .tr i{position:absolute;top:0;height:16px;border-radius:3px}
.conseil{border-left:4px solid var(--warn);padding:6px 10px;background:var(--warn-soft);font-size:13.5px;border-radius:0 6px 6px 0}
.conseil.ok{border-color:var(--ok);background:var(--ok-soft)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0} .item>div{min-width:0}
.item .t{font-weight:600} .item .s{font-size:12.5px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{display:flex;width:100%;max-width:780px}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 2px;min-height:56px;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:480px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:500;z-index:9;text-align:center}
.conseil.bad{border-color:var(--bad);background:var(--bad-soft)}
.map{width:100%;height:auto;max-height:280px;background:var(--bg);border-radius:8px;display:block}
.tours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:440px){.tours{grid-template-columns:1fr}}
.tour{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.live-gps{font-variant-numeric:tabular-nums;font-size:13.5px;background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:8px;font-weight:500}
.fbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:8px;min-height:44px;cursor:pointer;flex:0 0 auto!important}
.fbtn.off{opacity:.5;cursor:not-allowed}.fbtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.fbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0;width:100%}
.check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink)}.check input{width:22px;height:22px;min-height:0;flex:none}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
.banner button{min-height:38px;padding:6px 12px;margin-top:6px}
nav.tabs button{font-size:11px}
.cmp3 th,.cmp3 td{white-space:normal;padding-inline:5px;font-size:13px}.cmp3 th{font-size:10.5px}.cmp3 td:first-child{width:38%}
</style>

 {id:"chou",nom:"Chou",fam:"Maraîchage irrigué",unite:"1 000 m²",uv:"kg",def:2,rdt:2760,prix:75,pertes:5,sous:0,L:5,cycles:1,vr:35,vp:25,start:9,cal:[25,25,30,18,2],ven:[0,0,0,50,50],calOk:true,inv:IRR,niv:"pub",
  src:"Fiche technico-économique chou de saison sèche froide, CRA Dosso, version 2, février 2023 (25 producteurs suivis en conseil de gestion, campagne 2021-2022) : 23 sacs de 60 kg pour 500 m², soit 2 760 kg pour 1 000 m², sac vendu 4 500 F sur le site de production en janvier-février, charges 36 300 F pour 500 m², calendrier d'octobre à février. Les producteurs suivis vont de 14 à 31 sacs pour 500 m². C'est une référence de Dosso : la base CGEF Maradi 2021 donnait des charges proches (médiane 78 500 F) mais une valeur de production plus faible (117 600 F pour 1 000 m²). Les investissements de la fiche ne sont pas repris.",url:[["Fiche chou CRA Dosso 2023",RECA+"fte_chou_dosso_version_2_fevrier_2023.pdf"]],

  {id:"tomate",nom:"Tomate",fam:"Maraîchage irrigué",unite:"1 000 m²",uv:"kg",def:2,rdt:1984,prix:94,pertes:5,sous:0,L:6,cycles:1,vr:35,vp:25,start:9,cal:[22,4,18,22,21,13],ven:[0,0,0,0,50,50],calOk:true,inv:IRR,niv:"pub",
  src:"Fiche technico-économique tomate, CRA Maradi, version 2, juillet 2022 (20 producteurs suivis en conseil de gestion, campagne sèche 2020-2021) : rendement de référence de 62 paniers de 32 kg, soit 1 984 kg pour 1 000 m², panier vendu 3 000 F en moyenne en février-mars (94 F le kg), produit brut 186 000 F, charges opérationnelles 77 600 F, marge brute 108 400 F, calendrier des charges d'octobre à mars. La fiche classe 32 paniers (1 024 kg) en rendement insuffisant et 95 paniers ou plus (3 264 kg) en bon rendement. Le résumé de la fiche cite aussi 1 824 kg pour 1 000 m² et 43 paniers par exploitation de 800 m², des chiffres qui ne se recoupent pas avec son tableau : c'est le tableau qui est retenu. Investissements indiqués : 167 000 F (forage, motopompe, réseau californien), comptés pour 2 000 m² de cultures. Les ventes sont réparties à parts égales entre février et mars, comme la récolte. À Agadez, la fiche de 2020 retient 1 092 kg et 47 400 F de charges. Pour mémoire, des essais en station donnent des potentiels bien plus élevés, qui ne sont pas des moyennes paysannes : 3 à 19 t/ha selon le site en saison des pluies au Burkina Faso (INERA, 2014-2015), et 72,5 t/ha en irrigation complète à la station IAR de Kadawa, au Nigeria (État de Kano, 2016-2019). À Kadawa, réduire l'eau de moitié sur trois stades fait perdre environ 44 % du rendement.",url:[["Fiche tomate CRA Maradi 2022",RECA+"fiche_technico-economique_tomate_maradi_2022.pdf"],["Fiche tomate CRA Agadez 2020",RECA+"fiche_technico-economique_tomate_cra_agadez_mars2020.pdf"],["Essais de variétés de tomate au Burkina Faso, Garane et al. 2019","https://m.elewa.org/Journals/wp-content/uploads/2019/06/1.Garane-Abstract-JAPS-Vol.40.3.pdf"],["Irrigation déficitaire de la tomate à Kadawa, Arab et al. 2025","https://jaet.niae.net/index.php/jaet/article/view/141"]],

 {id:"pdt",nom:"Pomme de terre",fam:"Maraîchage irrigué",unite:"1 000 m²",uv:"kg",def:2,rdt:1000,prix:200,pertes:5,sous:0,L:6,cycles:1,vr:35,vp:25,start:9,cal:[8.6,59.1,10.6,10.6,10.9,0.1],ven:[0,0,0,0,75,25],calOk:true,inv:IRR,niv:"pub",

  src:"Fiche technico-économique moringa de saison sèche, CRA Dosso, 2022 : 17 sacs de 60 kg de feuilles pour 1 000 m², 11 000 F le sac, charges 41 300 F, calendrier de septembre à avril. La base CGEF Maradi 2021 donne des charges plus basses (médiane 22 700 F) et une valeur de production de 88 900 F. Une note de suivi de la CRA Maradi (mai 2024, Goulbin Kaba) cite, pour une parcelle de 125 m² en saison des pluies, environ 3 récoltes par mois à 20 000 F chacune. C'est un revenu déclaré pour un seul cas, sans rendement ni charges : il n'est pas repris dans le calcul.",url:[["Fiche moringa CRA Dosso 2022",RECA+"fiche_technico-economique_cra_dosso_moringa_juin2022.pdf"],["Note de suivi maraîchage, CRA Maradi 2024",RECA+"note_de_suivi_maraichage_taimakon_m._cra_maradi_2024.pdf"]],

  src:"Prix retenu : 180 F le kg, prix bas de récolte. Une reprise de presse du bulletin du SIMA d'août 2026 citait 16 000 à 20 000 F le sac de 100 kg, sans préciser les marchés ; le bulletin lui-même donne 267 F le kg en moyenne nationale au consommateur, en baisse de 5 % seulement sur un an. Rendement : la moyenne nationale 2015-2024 est d'environ 508 kg par hectare (statistique agricole, portail Niger Data), de 355 kg en 2021 à 564 kg en 2024 ; selon le rapport d'évaluation de la campagne 2024, Maradi atteint 655 kg cette année-là, une bonne année. Les 500 kg retenus correspondent donc à une année moyenne. En milieu paysan dans le Fakara (ouest du Niger, 2000-2002), 84 % des parcelles sans engrais restent sous 400 kg par hectare ; la microdose (2 g de DAP par poquet) ajoute en moyenne 43 à 69 kg par hectare et rapporte moins qu'elle ne coûte sur 36 % des parcelles (Bielders et Gérard, 2015). Aucune fiche technico-économique trouvée pour le mil : les charges restent des hypothèses.",url:[["Rapport d'évaluation de la campagne d'hivernage 2024",RECA+"rapport-eper-2024-_vf.pdf"],["Rendements du mil 2015-2024, portail Niger Data","https://niger.opendataforafrica.org/twgaere/agriculture?lang=en"],["Microdose sur le mil dans le Fakara, Bielders et Gérard 2015","https://www.sciencedirect.com/science/article/abs/pii/S037842901400286X"],["Bulletin mensuel des produits agricoles du SIMA n° 351, août 2026","https://www.simaniger.net/_api/publications/bulletins/54/download"]],

 {id:"poulet",nom:"Poulet de chair",fam:"Élevage",unite:"bande de 100 sujets",uv:"sujet",def:2,rdt:100,prix:3000,pertes:7,sous:11500,L:2,cycles:4,vr:0,vp:15,start:0,cal:[65,35],ven:[0,100],calOk:false,inv:[["Poulailler en dur de 10 m² (100 sujets)",300000,10,1],["Mangeoires, abreuvoirs et petit matériel",70000,3,1]],niv:"part",
  src:"Référentiel technico-économique sur la filière avicole, PRADEL (Ministère de l'Agriculture et de l'Élevage, Enabel), partie poulets de chair, non daté, en ligne depuis janvier 2021 : bande de 1 500 poulets vendus pour 1 570 poussins achetés à 750 F, cycle de 60 jours, 5 220 kg d'aliment à 270-300 F le kg, charges de 2 839 000 F, poulet vendu 3 000 F, fiente 180 000 F. Les valeurs sont ramenées à 100 poussins mis en place. Le référentiel propose ailleurs un prix de vente de 2 391 F. Son tableau d'investissements reprend celui des pondeuses ; ses normes donnent 10 poulets par m² et un poulailler en dur à 30 000 F le m² (1 500 000 F pour 50 m²), mangeoires de 1 750 à 3 000 F et abreuvoirs de 1 500 à 3 500 F pièce : d'où 300 000 F de bâtiment pour 100 sujets, amorti sur 10 ans (note RECA de 2024 sur les bâtiments avicoles), et environ 70 000 F de matériel sur 3 ans. Un poulailler en matériaux locaux coûte environ 6 000 F le m². Bandes par an : 4, car 60 jours d'élevage et 10 à 15 jours de vide sanitaire laissent peu de marge pour une cinquième, et la chaleur de fin de saison sèche pénalise le poids au-delà de 37 °C. Mortalité : 7 %, entre les 4 à 6 % du référentiel pour la souche Cobb et les 9 % relevés à Dakar (2019) ; elle était de 2 à 3 % dans 18 élevages de Bobo-Dioulasso en saison fraîche (2018). Ces deux valeurs viennent de pays voisins et restent à vérifier sur le terrain.",url:[["Référentiel avicole PRADEL, poulets de chair",RECA+"rte_aviculture_poulet_de_chair_pradel.pdf"],["Bien concevoir son bâtiment d'élevage avicole, RECA 2024",RECA+"note_batiment_elevage_avicole_reca_2024.pdf"],["Élevages de poulets de chair de Bobo-Dioulasso, mémoire IDR 2018","https://bibliovirtuelle.u-naziboni.bf/biblio/opac_css/docnume/idr/environnement2/IDR-2018-BEL-ETU.pdf"]],
  charges:[["Poussins",75000],["Aliment",90600],["Prophylaxie",3800],["Litière, eau et électricité",7600],["Main-d'œuvre",3800]]},
 {id:"sesame",nom:"Sésame",fam:"Cultures pluviales",unite:"hectare",uv:"kg",def:2,rdt:500,prix:350,pertes:5,sous:0,L:5,cycles:1,vr:40,vp:25,start:5,cal:[35,25,15,5,20],ven:[0,0,0,0,100],calOk:false,inv:ATT,niv:"mix",
  src:"Étude sur le sésame dans le département d'Aguié, 2009 (bibliothèque Duddal) : charges de 48 500 F par hectare, 300 kg en culture associée et 600 kg en culture pure, 366 F le kg en moyenne. Étude de la filière huile de sésame, FCMN-Niya, 2020 (vos archives) : environ 500 kg par hectare et 300 à 400 F le kg. Les charges datent de 2009 et sont sans doute sous-estimées aujourd'hui.",url:[["Le sésame dans le département d'Aguié (Duddal)","https://duddal.org/files/original/ad86f06d1f7a1ce353608b9bf26caf0869275ad1.pdf"],["Fiche sésame CRA Diffa 2018 (non intégrée)",RECA+"FTE_Sesame_CRA_Diffa_Juin2018.pdf"]],

 {id:"pondeuses",nom:"Poules pondeuses (œufs)",fam:"Élevage",unite:"lot de 100 poules",uv:"casier de 30 œufs",def:3,rdt:66,prix:2250,pertes:0,sous:10000,L:0,cycles:12,vr:50,vp:15,start:0,cal:[],ven:[],calOk:true,inv:[["Poulailler (100 poules)",350000,15,1],["Poulettes prêtes à pondre (100)",350000,1.5,1]],niv:"mix",
  src:"Ponte : fiche technico-économique poules pondeuses, CRA Zinder, 2017 : taux de ponte de 75 %, mortalité de 10 % et œufs cassés déduits, soit 22 alvéoles de 30 œufs par jour pour 1 000 poules mises en place, c'est-à-dire 66 casiers par mois pour 100 poules, pendant 18 mois de ponte. Aliment, prix et poulailler : référentiel avicole du PRADEL (non daté, en ligne depuis janvier 2021), pour 1 000 poules : 120 g d'aliment de ponte par poule et par jour à 280 F le kg, œuf vendu 75 F (80 F dans un autre tableau), soit 2 250 F le casier, poule de réforme à 2 000 F (comptée ici pour 90 poules réparties sur 18 mois), poulailler de 3 500 000 F amorti sur 15 ans, poussin d'un jour à 1 250 F. Ce prix de l'aliment est presque le double de celui de vos sources de 2020-2021 (7 850 F le sac de 50 kg, soit 157 F le kg, avec un casier à 1 800 F et une réforme à 3 000 F) : relevez le prix actuel de l'aliment avant de conseiller. Le référentiel compte 12 mois de ponte pour 18 mois de charges et ses amortissements varient d'un tableau à l'autre. Le prix des poulettes prêtes à pondre reste une hypothèse. À Zinder, 90 % des promoteurs financés ont perdu 60 à 100 % de leurs poules par maladie : le risque sanitaire est le premier risque de cette activité.",url:[["Fiche poules pondeuses CRA Zinder 2017",RECA+"Fiche_technico-economique_Poules_pondeuses_CRAZider_V1_Avril2017.pdf"],["Note ferme avicole de Madaoua, RECA 2021",RECA+"note_ciapa_pormoteur_madaoua_vollailles.pdf"],["Référentiel avicole PRADEL, poules pondeuses",RECA+"rte_aviculture_poules_pondeuses_pradel.pdf"]],
  charges:[["Aliment",100800],["Main-d'œuvre",12500],["Soins, eau et électricité",4000]]},
 {id:"miel",nom:"Miel (ruches traditionnelles)",fam:"Apiculture et agroforesterie",unite:"ruche",uv:"litre",def:10,rdt:15,prix:3000,pertes:0,sous:0,L:6,cycles:1,vr:50,vp:20,start:0,cal:[40,0,0,0,30,30],ven:[0,0,0,0,50,50],calOk:false,inv:[["Ruche traditionnelle",2500,2,1],["Tenue et petit matériel",30000,5,30]],niv:"part",
  src:"Rendement : étude sur l'apiculture au Niger, Porporato et al., 2009 (enquêtes de 2005-2006) : 12 à 18 litres par ruche et par an à Madarounfa en deux récoltes, environ 9 ruches par apiculteur. Prix et coût des ruches : étude de marché de la filière miel, projet NIGLEM, février 2021 (Say et Torodi) : prix local prudent de 3 000 F le litre, jusqu'à 5 000 F à Maradi et à Dosso ; ruche traditionnelle à 2 000-2 500 F, ruche kényane à 18 000-35 000 F. L'étude de 2021 ne donne pas de rendement par ruche, et aucune des deux ne chiffre les charges de récolte et de filtrage : ce sont des hypothèses. Au Burkina Faso, une enquête auprès de 113 apiculteurs (publiée en 2024) relève que 32 % seulement des ruches installées sont colonisées (791 sur 2 489) : les 15 litres ne valent que pour les ruches habitées, et un promoteur qui installe 10 ruches doit compter sur 3 ou 4 ruches productives la première année. Cette enquête vient surtout de zones plus arrosées que Maradi.",url:[["Apiculture au Niger, Porporato et al. 2009","https://iris.unito.it/retrieve/e27ce426-a4af-2581-e053-d805fe0acbaa/Porporato%20et%20al.%202009_Apiculture_Niger.pdf"],["Étude de marché de la filière miel, NIGLEM 2021",RECA+"rapport_final_etude_marche_miel_niger_niglem_aid011451.pdf"],["Contraintes de l'apiculture au Burkina Faso, 2024","https://pmc.ncbi.nlm.nih.gov/articles/PMC11253321"]],
  charges:[["Récolte, filtrage et emballage",3000]]},

    const sc=r.cal.reduce((a,b)=>a+b,0)||1,sv=r.ven.reduce((a,b)=>a+b,0)||1,off=(r.start-S.start+12)%12;
    for(let c=0;c<Math.min(x.cy,Math.floor(12/r.L)||1);c++)for(let k=0;k<r.L;k++){const i=(off+c*r.L+k)%12;dep[i]+=x.co*r.cal[k]/sc;rec[i]+=x.ca*r.ven[k]/sv}});

  return {rows,min,mi,remb}}
function projection(N=3){const D=Math.max(1,+S.duree||1),C=+S.credit||0,g=k=>1+(+S[k]||0)/100;let reste=C,cum=(+S.apport||0)+C+(+S.subv||0)-S.inv.reduce((a,i)=>a+(+i[1]||0),0);const an=[],dep=cum;

function demarrer(i){if(!navigator.geolocation)return toast("Ce navigateur ne donne pas accès au GPS. Utilisez le ruban ou importez un tracé.");
  G={i,pts:[],acc:null,accs:[],id:null,wake:null,rejets:0};try{navigator.wakeLock.request("screen").then(w=>{if(G)G.wake=w;else w.release()}).catch(()=>{})}catch(e){}
  G.id=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});render()}
function onPos(p){if(!G)return;const c=p.coords,pt=[c.latitude,c.longitude];G.acc=c.accuracy;if(c.accuracy>25){G.rejets++;return majLive()}
  const last=G.pts[G.pts.length-1];if(last){const d=dist(...toXY([last,pt]));if(d<3)return majLive();if(d>60){G.rejets++;return majLive()}}G.pts.push(pt);G.accs.push(c.accuracy);majLive()}
function onErr(e){if(!G)return;if(e.code==1){stopG();toast("L'accès au GPS est refusé ici. Utilisez le ruban ou importez un tracé.");return render()}const n=document.getElementById("live-gps");if(n)n.textContent="Signal GPS perdu : restez à découvert, le relevé continue."}
function stopG(){if(G){try{navigator.geolocation.clearWatch(G.id)}catch(e){}try{G.wake&&G.wake.release()}catch(e){}}G=null}
function terminer(){if(!G)return;const {i,pts,accs}=G;stopG();if(pts.length<4){toast("Trop peu de points : le tour n'est pas enregistré.");return render()}const s=[...accs].sort((a,b)=>a-b);S.T.tours[i]={pts:pts.slice(0,5000),source:"GPS du téléphone",date:new Date().toISOString().slice(0,10),acc:Math.round(s[s.length>>1])};save();render()}
function majLive(){const e=document.getElementById("live-gps");if(e&&G)e.textContent=`${G.pts.length} points · précision ${G.acc==null?"en attente":"±"+Math.round(G.acc)+" m"}${G.rejets?` · ${G.rejets} position(s) écartée(s)`:""}`}

function lireTrace(txt){const t=txt.trim();if(t[0]=="{"||t[0]=="["){const o=JSON.parse(t);let c=null;const geo=g=>g&&(g.type=="Polygon"?g.coordinates[0]:g.type=="MultiPolygon"?g.coordinates[0][0]:g.type=="LineString"?g.coordinates:null);
    if(o.type=="FeatureCollection")c=geo((o.features.find(f=>geo(f.geometry))||{}).geometry);else if(o.type=="Feature")c=geo(o.geometry);else c=geo(o);if(!c)throw 0;return c.map(p=>[+p[1],+p[0]])}
  const d=new DOMParser().parseFromString(t,"application/xml");if(d.querySelector("parsererror"))throw 0;const nds=[...d.getElementsByTagName("trkpt"),...d.getElementsByTagName("rtept")],pts=(nds.length?nds:[...d.getElementsByTagName("wpt")]).map(n=>[+n.getAttribute("lat"),+n.getAttribute("lon")]);if(pts.length)return pts;
  const k=[...d.getElementsByTagName("coordinates")].map(n=>n.textContent).sort((a,b)=>b.length-a.length)[0];if(!k)throw 0;return k.trim().split(/\s+/).map(s=>{const a=s.split(",");return [+a[1],+a[0]]})}

function assainirT(o){const f=terrainVide();if(!o||typeof o!="object")return f;f.exemple=!!o.exemple;f.accord=!!(o.accord||o.partage===true);f.declaree=str(o.declaree!=null?o.declaree:(o.projet&&o.projet.declaree),12);

  <section class="panel"><h2>L'eau</h2><div class="row">${sel("te-src","Source prévue","eau.source",EAUX,E.source,d)}${txt("te-pro","Profondeur de l'eau (m), si connue","eau.profondeur",E.profondeur,'inputmode="decimal"'+d)}${sel("te-zon","Zone","eau.zone",ZONES,E.zone,d)}</div>${!pro()||c.eauVue?`<div class="row">${sel("tc-eau","Point d'eau vu par le conseiller","cons.eauVue",VU,c.eauVue,e)}${txt("tc-pro","Profondeur mesurée (m)","cons.profondeur",c.profondeur,'inputmode="decimal"'+e)}${txt("tc-deb","Débit mesuré (m³/h)","cons.debit",c.debit,'inputmode="decimal"'+e)}</div>`:""}</section>

function vControle(){const b=bilan(),A=controles(b),irr=irrL().length>0,T=S.T;let tab2=`<p class="small muted">Ajoutez une culture irriguée dans l'onglet Projet pour relier cette parcelle aux comptes. Pour une culture pluviale ou un élevage, reportez la taille vous-même dans l'activité.</p>`;
  if(irr&&b.S){const av=simuler(()=>{}),ap=simuler(()=>modifs(b)),l=(t,f)=>`<tr><td>${t}</td><td>${f(av)}</td><td>${f(ap)}</td></tr>`,ret=x=>x.m.inv?(x.m.retour==Infinity?"jamais":dec(x.m.retour)+" ans"):"–",dl2=av.m.res?(ap.m.res-av.m.res)/Math.abs(av.m.res)*100:null,same=Math.abs(ap.m.res-av.m.res)<1&&Math.abs(ap.m.inv-av.m.inv)<1&&Math.round(b.S)==+S.terrain;
    tab2=`<div class="tw"><table class="cmp3"><thead><tr><th>Par an, en FCFA</th><th>Projet actuel</th><th>Avec la parcelle</th></tr></thead><tbody><tr><td>Terrain irrigué (m²)</td><td>${S.terrainOn?fmt(S.terrain):"saisie libre"}</td><td>${fmt(b.S)}</td></tr>${l("Ventes",x=>fmt(x.m.ca))}${l("Charges",x=>fmt(x.m.co))}${l("Investissement",x=>fmt(x.m.inv))}${l("Résultat",x=>`<span class="${x.m.res<0?"neg":"pos"}">${fmt(x.m.res)}</span>`)}${l("Remboursement de l'investissement",ret)}${l("Diagnostic",x=>esc(x.v[1]))}</tbody></table></div>${dl2!=null&&!same?`<p class="small"><b>Résultat ${dl2<0?"en baisse":"en hausse"} de ${Math.abs(dl2).toFixed(0)} %.</b> Calcul du simulateur, avec toutes les activités du projet.</p>`:""}<div class="row"><button class="primary" data-ta="appliquer"${same?" disabled":""}>${same?"Déjà appliqué au projet":"Appliquer au projet"}</button>${T.app?`<button data-ta="annuler">Annuler l'application</button>`:""}</div>${T.app?`<p class="src">Dernière application le ${esc(T.app.date)}${T.app.cloture?`, clôture de ${fmt(T.app.cloture.cout)} F comptée dans les investissements`:""}${T.app.transport?`, transport de ${fmt(T.app.transport)} F/kg compté dans les charges`:""}.</p>`:`<p class="src">Le projet ne change pas tant que vous n'appliquez pas.</p>`}`}
  return `<section class="panel"><h2>Ce que cela change pour le projet</h2>${tab2}</section><section class="panel"><h2>Contrôles</h2>${A.length?A.map(a=>`<div class="conseil ${a.niv=="bad"?"bad":""}"><b>${esc(a.t)}.</b> ${esc(a.x)}</div>`).join(""):`<div class="conseil ok"><b>Aucune alerte.</b> Cela ne garantit ni le droit sur la terre, ni l'absence de conflit, ni la qualité de l'eau.</div>`}</section>`}
function vFiche(){const T=S.T,b=bilan(),c=T.cons,e=dC(),lignes=[["Surface déclarée",b.decl?fmt(b.decl)+" m²":"–","Promoteur"],["Surface au téléphone",b.tel?fmt(b.tel.area)+" m²":"–",b.ecart!=null?"Écart "+dec(b.ecart)+" %":"–"],["Surface au ruban",b.rub?fmt(b.rub.area)+" m²":"–","Promoteur"],["Surface vérifiée",b.ver?fmt(b.ver.area)+" m²":b.aut?fmt(b.aut)+" m²":"–",c.nom||"Conseiller"]];
  return `<section class="panel"><h2>Ce qui a été saisi et par qui</h2><div class="tw"><table><thead><tr><th>Information</th><th>Valeur</th><th>Source</th></tr></thead><tbody>${lignes.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join("")}</tbody></table></div><p class="src">Le calcul retient la valeur vérifiée la plus récente. Les valeurs du promoteur restent visibles.</p></section>
  ${pro()?(c.date?`<section class="panel"><h2>Avis du conseiller</h2><p class="small">${esc(c.nom)}, ${esc(lib(TITRES,c.titre).toLowerCase())}, le ${esc(c.date)}.</p>${c.note?`<p class="small">${esc(c.note)}</p>`:""}</section>`:""):`<section class="panel"><h2>Avis du conseiller</h2><div class="row">${txt("tc-nom","Nom","cons.nom",c.nom,e)}${sel("tc-tit","À quel titre","cons.titre",TITRES,c.titre,e)}</div><label>Remarques et points non contrôlés<textarea id="tc-not" data-tk="cons.note" rows="3"${e}>${esc(c.note)}</textarea></label><div class="row"><button class="primary" data-ta="signer"${c.nom&&c.titre&&!T.exemple?"":" disabled"}>${c.date?"Mettre à jour la date":"Signer la vérification"}</button></div>${c.date?`<p class="small"><span class="pill ok">Vérifié</span> Le ${esc(c.date)}, par ${esc(c.nom)}. Cela signifie que le conseiller a vu ou mesuré ces éléments.</p>`:""}</section>`}
  <section class="panel"><h2>Texte ajouté au plan d'affaires</h2><p class="small muted">Il s'ajoute à ce que vous écrivez dans « Terre et eau », sans le remplacer.</p><p class="small">${esc(texte())}</p><button data-tab="plan" style="align-self:flex-start">Aller au plan d'affaires</button></section>
  <section class="panel"><h2>Partager le projet</h2><p class="small muted">Le fichier contient tout le projet : le nom, le contour, les réponses et les chiffres. Rien n'est envoyé automatiquement : vous choisissez à qui le transmettre, par exemple par WhatsApp.</p><label class="check"><input id="tf-acc" type="checkbox" data-tk="accord"${T.accord?" checked":""}>${pro()?"J'accepte de partager ce projet avec mon conseiller":"Le promoteur a accepté ce partage"}</label><div class="row"><button class="primary" data-ta="save"${T.accord?"":" disabled"}>Enregistrer le fichier</button><label class="fbtn">Ouvrir un projet reçu<input id="imp-projet" type="file" data-projet="1" aria-label="Ouvrir un projet reçu" accept=".json"></label></div>
  ${attente?`<div class="conseil"><b>${attente.k=="projet"?"Remplacer le projet ouvert sur ce téléphone par celui reçu ?":"Remplacer la fiche de parcelle de ce projet par celle reçue ?"}</b> ${attente.k=="projet"?`Il compte ${attente.S.lignes.length} activité(s)${attente.date?`, enregistré le ${esc(attente.date)}`:""}. `:""}Enregistrez d'abord le projet actuel si besoin.<div class="row" style="margin-top:8px"><button class="primary" data-ta="ok-imp">Remplacer</button><button data-ta="no-imp">Annuler</button></div></div>`:""}
  ${brut?`<label>Contenu du fichier<textarea id="tbrut" class="msg" readonly>${esc(brut)}</textarea></label>`:""}</section>`}
function vue(){const T=S.T,SO=[["surface","Surface"],["terre","Terre et eau"],["controle","Contrôles"],["fiche","Fiche"]];return `<section class="panel"><h1>La parcelle</h1><p class="small muted">Mesurez le terrain, renseignez la terre et l'eau, puis voyez ce que cela change pour votre projet. Mode Simple : promoteur. Mode Expert : conseiller, qui vérifie sans effacer.</p><div class="seg" role="group" aria-label="Parties de la fiche">${SO.map(x=>`<button data-ta="sous" data-id="${x[0]}" aria-pressed="${sous==x[0]}">${x[1]}</button>`).join("")}</div></section><div id="t-tete">${tete()}</div>${T.exemple?`<div class="banner"><span>Parcelle fictive, pour montrer le fonctionnement. Elle n'entre pas dans le plan d'affaires.</span> <button data-ta="commencer">Commencer ma parcelle</button></div>`:""}${{surface:vSurface,terre:vTerre,controle:vControle,fiche:vFiche}[sous]()}`}
function live(){const e=document.getElementById("t-tete");if(e)e.innerHTML=tete();const b=bilan(),r=document.getElementById("rub");if(r)r.innerHTML=rubTxt(b);const s=document.querySelector("[data-ta=signer]");if(s)s.disabled=!(S.T.cons.nom&&S.T.cons.titre&&!S.T.exemple);majLive()}
function poser(path,v){const ks=path.split(".");let o=S.T;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;save()}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.tk;if(!k||e.target.type=="checkbox"||e.target.tagName=="SELECT")return;poser(k,e.target.value);live()});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset||{};if(d.tk){if(t.tagName=="SELECT"||t.type=="checkbox"){poser(d.tk,t.type=="checkbox"?t.checked:t.value);render()}return}
  if(d.imp!=null&&t.files[0]){const i=+d.imp,fr=new FileReader();fr.onload=()=>{try{const pts=simplifier(lireTrace(fr.result).filter(p=>isFinite(p[0])&&isFinite(p[1])));if(pts.length<4)throw 0;S.T.tours[i]={pts:pts.slice(0,5000),source:"Tracé importé",date:new Date().toISOString().slice(0,10),acc:null};save();render();toast(`Tracé importé : ${pts.length} points.`)}catch(x){toast("Fichier illisible. Formats acceptés : GPX, KML, GeoJSON, avec au moins 4 points.")}};fr.readAsText(t.files[0])}
  if(d.projet&&t.files[0]){const fr=new FileReader();fr.onload=()=>ouvrir(fr.result);fr.readAsText(t.files[0])}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.ta==null)return;const a=b.dataset.ta,id=b.dataset.id;
  if(a=="sous"){sous=id;attente=null}else if(a=="go")return demarrer(+id);else if(a=="fin")return terminer();else if(a=="suppr"){S.T.tours[+id]=null;save()}
  else if(a=="appliquer")appliquer();else if(a=="annuler")annuler();else if(a=="commencer"){const ap=S.T.app;S.T=terrainVide();if(ap)annulerApres(ap);save();sous="surface";toast("Parcelle vide : à vous de la mesurer.")}
  else if(a=="signer"){S.T.cons.date=today();save();toast("Vérification signée.")}else if(a=="save")return enregistrer();
  else if(a=="ok-imp"){if(attente){if(attente.k=="projet")S=attente.S;else S.T=attente.T;attente=null;brut=null;sync();save();toast("Projet ouvert.")}}else if(a=="no-imp")attente=null;render()});
function annulerApres(ap){if(ap.avant!=null)S.terrain=ap.avant;poserTransport(0);sync()}
return {vue,live,bandeau,alertes,docTexte,statutSurface,cloreLigne:()=>{if(S.T.app)S.T.app.cloture=null},renseigne,bilan,controles};
})();

window.claude?.use?.("downloads").then(d=>dl=d).catch(()=>{});
function addL(id){const l=ligne(id);if(irrig(REF(id))&&S.terrainOn){const libre=100-irrL().reduce((a,x)=>a+(+x.part||0),0);l.part=Math.max(0,Math.min(libre,25))}S.lignes.push(l);S.cur=S.lignes.length-1}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return window.scrollTo(0,0)}
  const a=b.dataset.act,id=b.dataset.id,l=S.lignes[S.cur];if(!a)return;
  if(a=="mode")S.mode=id; else if(a=="cur")S.cur=+id; else if(a=="dell")S.lignes.splice(+id,1);
  else if(a=="addl"){addL($("#f-add").value);toast("Activité ajoutée au projet.")}
  else if(a=="terr")S.terrainOn=id=="1"; else if(a=="prix"){l.prix=+id;toast("Prix de vente mis à jour.")} else if(a=="horizon")S.horizon=+id;
  else if(a=="addch")l.charges.push(["Nouveau poste",0]); else if(a=="delch")l.charges.splice(+id,1);
  else if(a=="addinv"){S.inv.push(["Équipement",0,5]);S.invEd=true} else if(a=="delinv"){if(S.inv[+id]&&S.inv[+id][0]=="Clôture de la parcelle")TR.cloreLigne();S.inv.splice(+id,1);S.invEd=true}
  else if(a=="invauto")S.invEd=false;
  else if(a=="partage"){const t=S.inv.reduce((x,i)=>x+(+i[1]||0),0);if(!t)return toast("Aucun investissement à financer.");S.subv=Math.round(t*.4);S.credit=Math.round(t*.5);toast("Subvention et crédit calculés sur "+fmt(t)+" FCFA d'investissement.")}
  else if(a=="offre")S.offre=id; else if(a=="vers"){S.offre=id;tab="offres";window.scrollTo(0,0)}
  else if(a=="copier"){try{await navigator.clipboard.writeText(demande());toast("Message copié. Collez-le dans WhatsApp ou un SMS.")}catch(err){toast("Copie impossible ici : sélectionnez le message et copiez-le à la main.")}return}
  else if(a=="charger"){addL(id);tab="projet";window.scrollTo(0,0);toast("Activité ajoutée au projet.")}
  else if(a=="reset"){S=defaut();toast("Exemple rechargé.")}
  else if(a=="docx"){if(typeof JSZip=="undefined")return toast("Le générateur de document n'a pas pu se charger. Vérifiez la connexion.");
    if(!dl){try{const u=URL.createObjectURL(await docxBlob()),k=document.createElement("a");k.href=u;k.download="plan_d_affaires.docx";document.body.appendChild(k);k.click();k.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Plan d'affaires enregistré dans les téléchargements.")}catch(err){toast("Le téléchargement n'a pas abouti.")}return}
    try{await dl.save({filename:"plan_d_affaires.docx",data:await docxBlob()});toast("Plan d'affaires enregistré.")}catch(err){toast(err&&err.code=="declined"?"Téléchargement annulé.":"Le téléchargement n'a pas abouti. Réessayez dans un instant.")}return}
  sync();save();render()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.sel=="energie"){S.energie=t.value;sync();save();render()}
  else if(t.dataset.sel=="start"){S.start=+t.value;save();campagne()}
  else if((t.dataset.lk=="n"||t.dataset.part||t.dataset.k=="terrain")&&tab=="projet"){sync();save();render()}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset,l=S.lignes[S.cur];
  if(d.k)S[d.k]=t.value===""?0:+t.value; else if(d.lk)l[d.lk]=t.value===""?0:+t.value; else if(d.part)S.lignes[+d.part].part=+t.value||0; else if(d.pa)S.pa[d.pa]=t.value; else if(d.t)S[d.t]=t.value;
  else if(d.cl)l.charges[+d.cl][0]=t.value; else if(d.cm)l.charges[+d.cm][1]=+t.value||0;
  else if(d.il){S.inv[+d.il][0]=t.value;S.invEd=true} else if(d.im){S.inv[+d.im][1]=+t.value||0;S.invEd=true} else if(d.id2){S.inv[+d.id2][2]=+t.value||1;S.invEd=true} else return;
  sync();save();live()});
render();
</script>
